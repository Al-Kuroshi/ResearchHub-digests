title: ResearchHub Digest
description: >-
  Weekly digests of AI and software research, generated by ResearchHub from
  the blogs, GitHub releases and YouTube channels it follows. Every insight
  cites the items it comes from.
url: https://al-kuroshi.github.io
baseurl: /ResearchHub-digests
project_url: https://github.com/Al-Kuroshi/ResearchHub
timezone: Asia/Karachi

# One file per digest, pushed by the ResearchHub API into _digests/<digest>/.
# Each file sets its own permalink (/digests/<digest>/<number>/).
collections:
  digests:
    output: true

defaults:
  - scope: {type: digests}
    values: {layout: issue}

exclude:
  - README.md
  - PRODUCT.md
  - DESIGN.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .impeccable

markdown: kramdown
